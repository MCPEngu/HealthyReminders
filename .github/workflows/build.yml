name: Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, for example v0.1.0. Leave empty to only build current ref."
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-pc-windows-msvc

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  windows:
    name: Windows build and release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Resolve release tag
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "RELEASE_TAG=${{ inputs.tag }}" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            "RELEASE_TAG=${{ github.ref_name }}" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Checkout release tag
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Checkout
        if: github.event_name != 'workflow_dispatch' || inputs.tag == ''
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: ${{ env.TARGET }}
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: ${{ runner.os }}-${{ env.TARGET }}

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Check
        run: cargo check --locked --target $env:TARGET

      - name: Test
        run: cargo test --locked --target $env:TARGET

      - name: Clippy
        run: cargo clippy --locked --target $env:TARGET -- -D warnings

      - name: Build app
        run: cargo build --locked --release --target $env:TARGET

      - name: Package release artifact
        if: env.RELEASE_TAG != ''
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target\$env:TARGET\release\HealthyReminders.exe" "dist\HealthyReminders-$env:RELEASE_TAG-windows-x64.exe"

      - name: Publish GitHub Release
        if: env.RELEASE_TAG != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = "dist\HealthyReminders-$env:RELEASE_TAG-windows-x64.exe"
          gh release view "$env:RELEASE_TAG" *> $null
          if ($LASTEXITCODE -eq 0) {
            $oldZip = "HealthyReminders-$env:RELEASE_TAG-windows-x64.zip"
            try {
              gh release delete-asset "$env:RELEASE_TAG" "$oldZip" --yes *> $null
            } catch {
            }
            gh release upload "$env:RELEASE_TAG" "$asset" --clobber
          } else {
            gh release create "$env:RELEASE_TAG" "$asset" `
              --title "HealthyReminders $env:RELEASE_TAG" `
              --generate-notes `
              --verify-tag
          }
