name: Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-pc-windows-msvc

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows release build
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: ${{ env.TARGET }}
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ runner.os }}-${{ env.TARGET }}

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Check
        run: cargo check --locked --target $env:TARGET

      - name: Test
        run: cargo test --locked --target $env:TARGET

      - name: Clippy
        run: cargo clippy --locked --target $env:TARGET -- -D warnings

      - name: Build release
        run: cargo build --locked --release --target $env:TARGET

      - name: Stage artifact
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target\$env:TARGET\release\HealthyReminders.exe" "dist\HealthyReminders.exe"

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: HealthyReminders-${{ env.TARGET }}
          path: dist/HealthyReminders.exe
          if-no-files-found: error
